<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lanchonete</h1>
    <p>Calcule o valor total da sua compra aqui</p>

    <div>
        <label for="codigo">Código do produto comprado:</label>
        <input type="number" id="codigo" placeholder="Digite o código (1 a 5)">

        <label for="quantidade">Quantidade comprada:</label>
        <input type="number" id="quantidade" placeholder="Digite a quantidade">
    </div>

    <button>Calcular valor</button>

    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
